name: Clean-machine verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen environment
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify release
        run: |
          python -m pip check
          python scripts/judge_check.py
          python scripts/verify_evidence.py
          python -m pytest -q
