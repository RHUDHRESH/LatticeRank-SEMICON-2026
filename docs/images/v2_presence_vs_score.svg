<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Presence versus coordinate trust</title>
<desc id="desc">Two-axis reading of the found flag and the score column.</desc>
<rect x="0.0" y="0.0" width="1200.0" height="720.0" rx="0.0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="60.0" y="58.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172033" text-anchor="start">found and score answer different questions</text>
<text x="60.0" y="96.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#657089" text-anchor="start">A present pair can still be the wrong lattice copy. That is found = 1 with a low score.</text>
<rect x="160.0" y="150.0" width="460.0" height="215.0" rx="0.0" fill="#fff7e8" stroke="none" stroke-width="0.0"/>
<rect x="620.0" y="150.0" width="460.0" height="215.0" rx="0.0" fill="#e9faf3" stroke="none" stroke-width="0.0"/>
<rect x="160.0" y="365.0" width="460.0" height="215.0" rx="0.0" fill="#fff1f1" stroke="none" stroke-width="0.0"/>
<rect x="620.0" y="365.0" width="460.0" height="215.0" rx="0.0" fill="#fff7e8" stroke="none" stroke-width="0.0"/>
<line x1="620.0" y1="150.0" x2="620.0" y2="580.0" stroke="#172033" stroke-width="2.0"/>
<line x1="160.0" y1="365.0" x2="1080.0" y2="365.0" stroke="#172033" stroke-width="2.0"/>
<text x="184.0" y="198.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#d88b17" text-anchor="start">Unusual: review the decision</text>
<text x="184.0" y="230.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#657089" text-anchor="start">Low presence evidence, high coordinate trust</text>
<text x="644.0" y="198.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#1c9b67" text-anchor="start">Present and localized</text>
<text x="644.0" y="230.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#657089" text-anchor="start">Act on the coordinate</text>
<text x="184.0" y="413.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#d05252" text-anchor="start">Absent or unusable</text>
<text x="184.0" y="445.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#657089" text-anchor="start">Pose columns are zero by contract</text>
<text x="644.0" y="413.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#d88b17" text-anchor="start">Present but likely mislocalized</text>
<text x="644.0" y="445.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#657089" text-anchor="start">Confirm the selected lattice site</text>
<text x="620.0" y="620.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">Presence evidence  --&gt;  found</text>
<text x="78.0" y="365.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">Coordinate trust  --&gt;  score</text>
<text x="60.0" y="692.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#657089" text-anchor="start">Source: register.py contract. Official-sample false positives sit in the low-score present-flag region.</text>
</svg>
