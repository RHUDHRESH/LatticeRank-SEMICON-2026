<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Phase 2 blind dataset composition</title>
<desc id="desc">200 organizer pairs split across nominal, degraded, absent, and RGB bonus sets.</desc>
