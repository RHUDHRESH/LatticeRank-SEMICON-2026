<text x="60.0" y="532.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#657089" text-anchor="start">Source: Phase 2 addendum, dataset composition slide. Sample pairs are a 20-pair I/O subset.</text>
