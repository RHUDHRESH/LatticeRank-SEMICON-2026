<text x="627.0" y="258.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Set B</text>
<text x="627.0" y="284.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">70 pairs</text>
<rect x="816.0" y="220.0" width="216.0" height="84.0" rx="0.0" fill="#d05252" stroke="none" stroke-width="0.0"/>
<text x="924.0" y="258.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Set C</text>
<text x="924.0" y="284.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">40 pairs</text>
