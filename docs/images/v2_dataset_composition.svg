<text x="1086.0" y="284.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">20 pairs</text>
<rect x="60.0" y="344.0" width="22.0" height="22.0" rx="5.0" fill="#2f6fed" stroke="none" stroke-width="0.0"/>
<text x="96.0" y="360.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#172033" text-anchor="start">Set A  70/200  —  Nominal pose, reference present</text>
<rect x="60.0" y="380.0" width="22.0" height="22.0" rx="5.0" fill="#d88b17" stroke="none" stroke-width="0.0"/>
