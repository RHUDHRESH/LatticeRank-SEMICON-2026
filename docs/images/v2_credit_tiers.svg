<text x="60.0" y="96.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#657089" text-anchor="start">Subpixel work is rewarded. Pose is scored only after localization credit is already &gt; 0.</text>
