<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Localization and pose credit tiers</title>
<desc id="desc">Published Euclidean and pose tolerances used to convert errors into points.</desc>
