<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Phase 1 versus Phase 2 task changes</title>
<desc id="desc">The three assumptions Phase 2 removes, plus the expanded output contract.</desc>
<rect x="0.0" y="0.0" width="1200.0" height="680.0" rx="0.0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="60.0" y="58.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172033" text-anchor="start">What Phase 2 actually changes</text>
<text x="60.0" y="96.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#657089" text-anchor="start">Everything else in the Phase 1 statement still applies: image size, origin, nearest-to-centre rule, Python zip.</text>
<rect x="430.0" y="140.0" width="330.0" height="44.0" rx="10.0" fill="#2f6fed" stroke="none" stroke-width="0.0"/>
<text x="595.0" y="170.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Phase 1 as issued</text>
<rect x="800.0" y="140.0" width="340.0" height="44.0" rx="10.0" fill="#1c9b67" stroke="none" stroke-width="0.0"/>
<text x="970.0" y="170.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Phase 2 addendum</text>
<text x="60.0" y="238.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Zoom</text>
<rect x="430.0" y="210.0" width="330.0" height="58.0" rx="12.0" fill="#eaf2ff" stroke="none" stroke-width="0.0"/>
<text x="445.0" y="246.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#172033" text-anchor="start">Exactly 10x, given</text>
<rect x="800.0" y="210.0" width="340.0" height="58.0" rx="12.0" fill="#e9faf3" stroke="none" stroke-width="0.0"/>
<text x="816.0" y="246.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#172033" text-anchor="start">Unknown, uniform in [8x, 12x]</text>
<text x="60.0" y="316.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Rotation</text>
<rect x="430.0" y="288.0" width="330.0" height="58.0" rx="12.0" fill="#eaf2ff" stroke="none" stroke-width="0.0"/>
<text x="445.0" y="324.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#172033" text-anchor="start">Noise of 1-3 deg, not reported</text>
<rect x="800.0" y="288.0" width="340.0" height="58.0" rx="12.0" fill="#e9faf3" stroke="none" stroke-width="0.0"/>
<text x="816.0" y="324.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#172033" text-anchor="start">Unknown +/-5 deg, must be reported</text>
<text x="60.0" y="394.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Presence</text>
<rect x="430.0" y="366.0" width="330.0" height="58.0" rx="12.0" fill="#eaf2ff" stroke="none" stroke-width="0.0"/>
<text x="445.0" y="402.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#172033" text-anchor="start">Always present</text>
<rect x="800.0" y="366.0" width="340.0" height="58.0" rx="12.0" fill="#e9faf3" stroke="none" stroke-width="0.0"/>
<text x="816.0" y="402.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#172033" text-anchor="start">~20% of pairs contain no true instance</text>
<text x="60.0" y="472.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Output</text>
<rect x="430.0" y="444.0" width="330.0" height="58.0" rx="12.0" fill="#eaf2ff" stroke="none" stroke-width="0.0"/>
<text x="445.0" y="480.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#172033" text-anchor="start">x, y</text>
<rect x="800.0" y="444.0" width="340.0" height="58.0" rx="12.0" fill="#e9faf3" stroke="none" stroke-width="0.0"/>
<text x="816.0" y="480.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#172033" text-anchor="start">x, y, theta, scale, found, score</text>
<text x="60.0" y="550.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">RGB</text>
<rect x="430.0" y="522.0" width="330.0" height="58.0" rx="12.0" fill="#eaf2ff" stroke="none" stroke-width="0.0"/>
<text x="445.0" y="558.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#172033" text-anchor="start">Not required</text>
<rect x="800.0" y="522.0" width="340.0" height="58.0" rx="12.0" fill="#e9faf3" stroke="none" stroke-width="0.0"/>
<text x="816.0" y="558.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#172033" text-anchor="start">Set D bonus, 20 optical pairs</text>
<text x="60.0" y="652.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#657089" text-anchor="start">Source: Phase 2 addendum, 'What Changes in Phase 2'. Hard-coding the disclosed bounds is intended.</text>
</svg>
