<text x="460.0" y="390.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">5 s</text>
<line x1="660.0" y1="210.0" x2="660.0" y2="360.0" stroke="#dce2ec" stroke-width="2.0" stroke-dasharray="6 6"/>
<text x="660.0" y="390.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">10 s</text>
<line x1="860.0" y1="210.0" x2="860.0" y2="360.0" stroke="#dce2ec" stroke-width="2.0" stroke-dasharray="6 6"/>
<text x="860.0" y="390.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">15 s</text>
<line x1="1060.0" y1="210.0" x2="1060.0" y2="360.0" stroke="#d05252" stroke-width="2.0"/>
<text x="1060.0" y="390.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">20 s</text>
<text x="460.0" y="204.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#d05252" text-anchor="middle">median budget</text>
<text x="1060.0" y="204.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#d05252" text-anchor="middle">hard timeout</text>
<circle cx="444.4" cy="250.0" r="10.0" fill="#2f6fed" stroke="none" stroke-width="0.0"/>
<text x="462.4" y="256.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172033" text-anchor="start">Official sample median  4.61 s</text>
<circle cx="451.6" cy="298.0" r="10.0" fill="#10a4b5" stroke="none" stroke-width="0.0"/>
<text x="469.6" y="304.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172033" text-anchor="start">Official sample max  4.79 s</text>
<circle cx="376.9" cy="346.0" r="10.0" fill="#1c9b67" stroke="none" stroke-width="0.0"/>
<text x="394.9" y="352.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172033" text-anchor="start">Internal uncontended median  2.92 s</text>
<circle cx="388.2" cy="394.0" r="10.0" fill="#d88b17" stroke="none" stroke-width="0.0"/>
<text x="406.2" y="400.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172033" text-anchor="start">Internal P95  3.21 s</text>
<text x="60.0" y="592.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#657089" text-anchor="start">Sources: official_sample_evaluation.json runtime; uncontended_runtime.json n=60.</text>
