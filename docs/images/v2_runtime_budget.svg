<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Measured runtime versus published budgets</title>
<desc id="desc">Official-sample and uncontended internal timings against the 5 s and 20 s limits.</desc>
<rect x="0.0" y="0.0" width="1200.0" height="620.0" rx="0.0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="60.0" y="58.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172033" text-anchor="start">Runtime against the published budgets</text>
<text x="60.0" y="96.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#657089" text-anchor="start">Median budget 5 s per pair. Hard timeout 20 s scores that pair zero.</text>
<rect x="220.0" y="180.0" width="880.0" height="250.0" rx="18.0" fill="#f7f9fc" stroke="none" stroke-width="0.0"/>
<line x1="260.0" y1="210.0" x2="260.0" y2="360.0" stroke="#dce2ec" stroke-width="2.0" stroke-dasharray="6 6"/>
