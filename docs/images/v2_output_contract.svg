<text x="938.0" y="380.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#657089" text-anchor="middle">1 or 0; zero pose if 0</text>
<rect x="1016.0" y="300.0" width="136.0" height="56.0" rx="10.0" fill="#1c9b67" stroke="none" stroke-width="0.0"/>
<text x="1084.0" y="333.9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">score</text>
<text x="1084.0" y="380.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#657089" text-anchor="middle">Any monotone scale; ours is P(correct)</text>
<rect x="60.0" y="430.0" width="1080.0" height="120.0" rx="16.0" fill="#f7f9fc" stroke="none" stroke-width="0.0"/>
<text x="84.0" y="472.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">Present row: pair_id, x, y, theta, scale, 1, score</text>
<text x="84.0" y="508.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">Absent row: pair_id, 0, 0, 0, 0, 0, score   (score still carries evidence)</text>
<text x="84.0" y="536.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#657089" text-anchor="start">Organizer coordinates are not reproduced here. See HOW_TO_RUN.md for the header.</text>
<text x="60.0" y="596.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#657089" text-anchor="start">Source: Phase 2 addendum output contract; register.py COLUMNS.</text>
