<text x="358.0" y="174.3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">x</text>
<rect x="440.0" y="140.0" width="136.0" height="56.0" rx="10.0" fill="#2f6fed" stroke="none" stroke-width="0.0"/>
<text x="508.0" y="174.3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">y</text>
