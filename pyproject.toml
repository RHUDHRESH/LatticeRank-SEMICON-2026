[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftforge"
version = "1.0.0"
description = "LatticeRank: periodic-aware localization and SEM-like pair generation for wafer inspection"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.1",
  "scipy==1.18.0",
  "Pillow==12.3.0",
  "matplotlib==3.11.1",
  "scikit-learn==1.9.0",
  "joblib==1.5.3",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["driftforge*"]

[tool.setuptools.package-data]
driftforge = ["models/*.joblib", "models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
